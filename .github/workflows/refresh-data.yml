name: Refresh Data

on:
  schedule:
    # 6 AM ET  (10 UTC EDT / 11 UTC EST — use EDT; April–Oct covers MLB season)
    - cron: '0 10 * * *'
    # 3 PM ET — re-generate fantasy projections with west-coast lineups
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ---- Python: generate static data ----
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore Statcast cache
        uses: actions/cache@v4
        with:
          path: .statcast_cache
          key: statcast-cache-${{ hashFiles('scripts/generate_data.py') }}-${{ github.run_number }}
          restore-keys: |
            statcast-cache-${{ hashFiles('scripts/generate_data.py') }}-
            statcast-cache-
          save-always: true

      - name: Generate static data
        run: python scripts/generate_data.py

      - name: Generate fantasy projections
        # Uses the same pybaseball / httpx deps from scripts/requirements.txt,
        # plus backend/app/services code on sys.path. Writes
        # frontend/public/data/fantasy/projections_today.json.
        run: python scripts/generate_fantasy_projections.py

      # Save data as artifact so deploy workflow can reuse it
      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseball-data
          path: frontend/public/data
          retention-days: 7

      # ---- Node: build frontend ----
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---- Deploy ----
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
