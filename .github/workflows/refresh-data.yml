name: Refresh Data

on:
  schedule:
    # 6 AM ET  (10 UTC EDT / 11 UTC EST — use EDT; April–Oct covers MLB season)
    - cron: '0 10 * * *'
    # 3 PM ET — re-generate fantasy projections with west-coast lineups
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  # contents: write so we can commit the pp_line_log JSONL snapshots
  # back to the repo (each run appends to the day's file).
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ---- Python: generate static data ----
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore Statcast cache
        uses: actions/cache@v4
        with:
          path: .statcast_cache
          key: statcast-cache-${{ hashFiles('scripts/generate_data.py') }}-${{ github.run_number }}
          restore-keys: |
            statcast-cache-${{ hashFiles('scripts/generate_data.py') }}-
            statcast-cache-
          save-always: true

      - name: Generate static data
        run: python scripts/generate_data.py

      - name: Generate fantasy projections
        # Uses the same pybaseball / httpx deps from scripts/requirements.txt,
        # plus backend/app/services code on sys.path. Writes
        # frontend/public/data/fantasy/projections_today.json. Also
        # appends a snapshot row per projection (with PP lines) to the
        # dated JSONL log at backend/app/data/pp_line_log/YYYY-MM-DD.jsonl.
        run: python scripts/generate_fantasy_projections.py

      - name: Commit PP line log snapshot
        # Each cron run (6 AM + 3 PM ET) appends a fresh snapshot of
        # today's PP lines + model projections. Commit so the history
        # accumulates across runs and seasons.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/data/pp_line_log/*.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No PP-line-log changes to commit."
          else
            git commit -m "chore(pp-log): snapshot $(date -u +%Y-%m-%dT%H:%MZ) from refresh-data"
            git push
          fi

      # Save data as artifact so deploy workflow can reuse it
      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseball-data
          path: frontend/public/data
          retention-days: 7

      # ---- Node: build frontend ----
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---- Deploy ----
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
