name: Refresh Data

on:
  schedule:
    # Heavy daily workflow: runs ONCE at 6 AM ET (10 UTC EDT) to
    # regenerate all MLB data, refresh the statcast cache, rebuild the
    # frontend, and deploy. Takes ~30-40 min because generate_data.py
    # pulls a lot of Statcast history.
    #
    # The LIGHT workflow (refresh-fantasy.yml) handles intraday updates
    # 4× more per day (9/11/1/3 ET) in ~3-5 min each — it skips the
    # heavy generate_data.py step and just regenerates the fantasy
    # projections + PP log + deploys.
    - cron: '0 10 * * *'   # 6 AM ET — morning heavy regen
  workflow_dispatch:

permissions:
  # contents: write so we can commit the pp_line_log JSONL snapshots
  # back to the repo (each run appends to the day's file).
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ---- Python: generate static data ----
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore Statcast cache
        uses: actions/cache@v4
        with:
          path: .statcast_cache
          key: statcast-cache-${{ hashFiles('scripts/generate_data.py') }}-${{ github.run_number }}
          restore-keys: |
            statcast-cache-${{ hashFiles('scripts/generate_data.py') }}-
            statcast-cache-
          save-always: true

      - name: Generate static data
        run: python scripts/generate_data.py

      - name: Generate fantasy projections
        # Uses the same pybaseball / httpx deps from scripts/requirements.txt,
        # plus backend/app/services code on sys.path. Writes
        # frontend/public/data/fantasy/projections_today.json. Also
        # appends a snapshot row per projection (with PP lines) to the
        # dated JSONL log at backend/app/data/pp_line_log/YYYY-MM-DD.jsonl.
        run: python scripts/generate_fantasy_projections.py

      - name: Commit generated data + PP line log
        # Commits everything produced by generate_data.py AND
        # generate_fantasy_projections.py back to main:
        #   - frontend/public/data/standings.json
        #   - frontend/public/data/teams/**/*.json  (schedule, roster, etc.)
        #   - frontend/public/data/players/**/*.json  (per-player stats)
        #   - frontend/public/data/fantasy/projections_today.json
        #   - frontend/public/data/fantasy/todays_picks_lock.json
        #   - backend/app/data/pp_line_log/*.jsonl
        #
        # This is required because deploy-frontend.yml no longer
        # downloads the baseball-data artifact (it was clobbering freshly
        # committed fantasy data). The site now serves whatever's
        # committed — so refresh-data.yml must commit its output.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/standings.json 2>/dev/null || true
          git add frontend/public/data/teams 2>/dev/null || true
          git add frontend/public/data/players 2>/dev/null || true
          git add frontend/public/data/fantasy/projections_today.json 2>/dev/null || true
          git add frontend/public/data/fantasy/todays_picks_lock.json 2>/dev/null || true
          git add backend/app/data/pp_line_log/*.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): daily refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $i/3) — rebasing onto remote and retrying..."
              git pull --rebase origin main
            done
          fi

      # Save data as artifact so deploy workflow can reuse it
      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseball-data
          path: frontend/public/data
          retention-days: 7

      # ---- Node: build frontend ----
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---- Deploy ----
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
