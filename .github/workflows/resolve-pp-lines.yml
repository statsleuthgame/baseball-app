name: Resolve PP Lines (nightly)

# Joins actuals to yesterday's PP-line log after all MLB games are final.
# Produces `backend/app/data/pp_line_log/<YYYY-MM-DD>_resolved.jsonl`
# with the result of every logged PP line (over / under / push) so we
# can compute real hit-rate-per-tier metrics over time.

on:
  schedule:
    # 4 AM ET daily — after late West-coast games finalize (~1 AM PT).
    # 8 UTC during EDT months (Mar-Nov) covers the MLB season.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD to resolve (defaults to yesterday)"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: pp-line-resolve
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Resolve PP lines
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/resolve_pp_lines.py "${{ github.event.inputs.date }}"
          else
            python scripts/resolve_pp_lines.py
          fi

      - name: Build daily recap + season rollup
        # Summarize yesterday's picks by tier + build running season
        # totals. Outputs to frontend/public/data/fantasy/yesterday_recap.json
        # and season_recap.json for the UI to read.
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/build_daily_recap.py "${{ github.event.inputs.date }}"
          else
            python scripts/build_daily_recap.py
          fi

      - name: Commit resolved log + refreshed stats cache + recap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/data/pp_line_log/*_resolved.jsonl 2>/dev/null || true
          git add backend/app/data/player_efp_stats_*.json 2>/dev/null || true
          git add frontend/public/data/fantasy/yesterday_recap.json 2>/dev/null || true
          git add frontend/public/data/fantasy/season_recap.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No resolved-log changes to commit."
          else
            git commit -m "chore(pp-log): resolve $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $i/3) — rebasing onto remote and retrying..."
              git pull --rebase origin main
            done
          fi
