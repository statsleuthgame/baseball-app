name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # NOTE: previously this step downloaded a data artifact from the
      # last refresh-data.yml run and overwrote frontend/public/data/.
      # That was the wrong model — it meant any commit with fresh data
      # (projections_today.json, todays_picks_lock.json, etc.) got
      # CLOBBERED by the stale artifact. We now commit data files
      # directly to the repo, so deploy-frontend just uses the checked
      # out versions. refresh-data.yml and refresh-fantasy.yml regen
      # data and commit-push it; this workflow then picks that up and
      # deploys via Pages on the next push.

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # URL of the Cloudflare Worker that proxies The Odds API. Set this
          # in repo Settings → Variables (Actions) so production builds wire
          # up the "Refresh Odds" button. Safe to expose publicly.
          VITE_ODDS_PROXY_URL: ${{ vars.VITE_ODDS_PROXY_URL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
