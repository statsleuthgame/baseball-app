name = "baseball-app-odds-proxy"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Both URLs are kept enabled. odds.statmask.com is the primary (corp-network
# friendly); the *.workers.dev URL stays alive as a fallback and so any old
# bundles still in browser caches keep working.
workers_dev = true
routes = [
  { pattern = "odds.statmask.com", custom_domain = true },
  { pattern = "data.statmask.com", custom_domain = true },
  # Path-based route on the apex. Corp DNS filters block newly-seen
  # subdomains entirely (NXDOMAIN), so we route /api/* on the apex —
  # statmask.com itself is in corp DNS caches from the user's game.
  # Requires the apex A records to be Proxied (orange cloud) and SSL
  # mode set to Full so Cloudflare can reach GitHub Pages.
  { pattern = "statmask.com/api/*", zone_name = "statmask.com" },
]
